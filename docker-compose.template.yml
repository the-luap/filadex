version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-filadex}
      # Required, not defaulted: a default here would become the password of
      # every install that followed the README's `cp .env.example .env`.
      # Generate one with: openssl rand -base64 24
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
      - POSTGRES_DB=${POSTGRES_DB:-filadex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filadex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Filadex Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-filadex}
      - PGPASSWORD=${POSTGRES_PASSWORD:?required}
      - PGDATABASE=${POSTGRES_DB:-filadex}
      # ggignore: both halves of the userinfo are variable references, but the
      # line matches postgres://user:pass@host and GitGuardian scans changed
      # lines, so touching it at all trips the URI-credential detector.
      - DATABASE_URL=postgres://${POSTGRES_USER:-filadex}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-filadex} # ggignore
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - INIT_SAMPLE_DATA=${INIT_SAMPLE_DATA:-false}
      # Set to a long random string (e.g. `openssl rand -hex 32`) so login sessions
      # survive restarts. If unset, a random secret is generated on each startup.
      - JWT_SECRET=${JWT_SECRET:-}
      # Only set to "true" if this runs behind a trusted reverse proxy (see .env.example)
      - TRUST_PROXY=${TRUST_PROXY:-false}
    depends_on:
      - db
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:

# Note: This is a template file. Copy to docker-compose.yml and modify as needed.
# For production deployments, consider adding:
# 1. A reverse proxy like Traefik or Nginx for SSL termination
# 2. Proper network configuration for security
# 3. Backup solutions for the database volume
# 4. Environment-specific configurations
