name: Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dialect: [postgres, sqlite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: testcontainers 12 declares `engines: node >= 22.22` and
          # bundles undici 8, which does `require('node:worker_threads')
          # .markAsUncloneable` at import. That export does not exist on Node 20,
          # so both jobs died loading the test harness, before any test ran.
          # The application itself is unaffected - testcontainers is a
          # devDependency, and the image is on node:22-alpine too.
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check (Postgres)
        if: matrix.dialect == 'postgres'
        run: npm run check
      - name: Type check (SQLite)
        if: matrix.dialect == 'sqlite'
        run: npm run check:sqlite
      - name: Run tests (Postgres)
        if: matrix.dialect == 'postgres'
        run: npm test
      - name: Run tests (SQLite)
        if: matrix.dialect == 'sqlite'
        run: TEST_DIALECT=sqlite npm test

  # ESLint, on the narrow rule set eslint.config.js explains. --max-warnings 0
  # so that a rule downgraded to "warn" still fails here: the check is green
  # today, and the point is that it stays that way.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Catches schema changes that missed a migration on either dialect: runs
  # drizzle-kit generate for each engine into temporary directories and fails
  # if any new migration is generated. Proves that checked-in migrations
  # fully describe shared/schema.ts for both PostgreSQL and SQLite.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:check-drift

  # Proves that a database created by an older Filadex still upgrades cleanly:
  # every row preserved, the same schema a fresh install gets, and every spool
  # carried across the filament_types backfill with its product identity intact.
  # This is what keeps migrations/legacy honest - those scripts are frozen and
  # are otherwise only exercised on a real upgrade, where finding out they broke
  # is too late.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: testcontainers 12 declares `engines: node >= 22.22` and
          # bundles undici 8, which does `require('node:worker_threads')
          # .markAsUncloneable` at import. That export does not exist on Node 20,
          # so both jobs died loading the test harness, before any test ran.
          # The application itself is unaffected - testcontainers is a
          # devDependency, and the image is on node:22-alpine too.
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:verify-upgrade

  # Applies migrations/sqlite/0000_light_catseye.sql, the DDL every real SQLite
  # deployment executes and which nothing else in CI executes at all: the test
  # suite builds its schema from shared/schema.ts through drizzle-kit's API, and
  # db:check-drift only compares snapshot JSON. An edit that breaks the file
  # would otherwise ship green and fail on the first `docker run`.
  #
  # Then runs both fixtures scripts/seed.ts ships. verify-upgrade no longer
  # invokes the seeder - it uses an inlined raw-SQL duplicate - so without this
  # the two can drift apart unnoticed.
  #
  # The two fixtures are alternatives, not steps: --demo refuses to run against a
  # database that already has users, and its catalog inserts are plain inserts
  # that collide with the starter rows. Each gets its own database.
  seed-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Starter fixture
        env:
          DATABASE_URL: file:${{ runner.temp }}/starter.db
        run: |
          npm run db:migrate:sqlite
          npm run db:init:sqlite
      - name: Demo fixture
        env:
          DATABASE_URL: file:${{ runner.temp }}/demo.db
        run: |
          npm run db:migrate:sqlite
          npm run db:seed:sqlite

  # The same two fixtures on Postgres, which is the engine they were written
  # against and the only one main's CI ever ran a seeder on.
  seed-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filadex
          # Throwaway credential for a service container that lives and dies
          # with this job, so it is safe to keep in the repository (hence the
          # ggignore tag).
          POSTGRES_PASSWORD: filadex # ggignore
          POSTGRES_DB: filadex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Starter fixture
        env:
          DATABASE_URL: postgres://filadex:filadex@localhost:5432/filadex
        run: |
          npm run db:migrate
          npm run db:init
      # migrate.pg.ts creates the database when it does not exist, so naming a
      # second one here is all it takes.
      - name: Demo fixture
        env:
          DATABASE_URL: postgres://filadex:filadex@localhost:5432/filadex_demo
        run: |
          npm run db:migrate
          npm run db:seed

  # Browser tests. Separate from `test` because they need a built application
  # and a browser, which the unit suite deliberately does not: keeping that one
  # fast is worth more than one job fewer. Runs on SQLite - see the note in
  # playwright.config.ts - so this job needs no service container.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
